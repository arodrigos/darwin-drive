name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # at-5: tipado estricto y lint con no-explicit-any y ban-ts-comment como error.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # at-4: presupuesto de JS del primer arranque, en cada build.
      - run: npm run verificar:presupuesto-bundle
      - run: npm run verificar:frontera-nucleo
      # at-8: repo público, nada interno en el árbol.
      - run: npm run verificar:publico
      # Los mensajes de commit y el texto del PR también quedan a la vista de todos.
      - name: Comprobar commits y texto del PR
        if: github.event_name == 'pull_request'
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
          RANGO: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/comprobar-publico.mjs --commits "$RANGO" --texto "$PR_TITULO"$'\n'"$PR_CUERPO"
      # Dependencias: falla ante una vulnerabilidad alta o crítica.
      - run: npm audit --omit=dev --audit-level=high

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Los fallos de node:test quedan como anotaciones: sin ellas el runner solo ve «exit code 1».
      - name: Run npm run test:unit
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$RUNNER_TEMP/unit.log" || {
            grep -E "^\s*not ok|^\s*(error|code|expected|actual):" "$RUNNER_TEMP/unit.log" | head -40 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          }

  medidas-fisica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # nf-7: coste por coche y paso (imprime mediana y p95 por pista).
      - run: npm run medir:fisica
      # nf-6: la física no premia los fallos (2000 genomas por pista).
      - run: npm run medir:anomalias
      # dif-2: las cuatro clásicas se complican (mediana ≤ 0,7 × la anterior) sin un muro en ningún tramo.
      - run: npm run medir:fragilidad
      - run: npm run medir:pistas -- --umbral

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # tb-2: el recorrido a 820x1180 y 1180x820, en paralelo para no alargar el e2e normal.
  e2e-tabletas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:tabletas
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-tabletas
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
